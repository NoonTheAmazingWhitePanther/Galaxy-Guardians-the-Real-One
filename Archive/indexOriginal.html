<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Verlet Worlds + Config Menu</title>
<style>
  /* ========== ORIGINAL STYLES (unchanged) ========== */
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono&display=swap');
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{background:#04040c;overflow:hidden;width:100vw;height:100vh;cursor:none}
  canvas{display:block}
  #cursor{
    position:fixed;z-index:999;pointer-events:none;
    width:12px;height:12px;border:1px solid rgba(255,255,255,.5);
    border-radius:50%;transform:translate(-50%,-50%);
    transition:width .1s,height .1s,border-color .1s,background .1s;
  }
  #cursor.holding{width:5px;height:5px;background:rgba(255,200,60,1);
    border-color:rgba(255,200,60,1);box-shadow:0 0 18px 6px rgba(255,160,30,.5)}
  #hint{
    position:fixed;z-index:900;top:28px;left:50%;transform:translateX(-50%);
    color:rgba(180,210,255,.2);font-size:9px;letter-spacing:.32em;
    pointer-events:none;white-space:nowrap;
    font-family:'Space Mono',monospace;
    opacity:0;animation:fi 1s 1.5s ease forwards;
  }
  #ui{
    position:fixed;z-index:900;bottom:28px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:20px;
    font-family:'Space Mono',monospace;
    opacity:0;animation:fi 1s 2s ease forwards;
  }
  .lbl{color:rgba(180,210,255,.22);font-size:8px;letter-spacing:.28em;pointer-events:none}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:80px;height:1px;background:rgba(180,210,255,.12);border:none;outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:8px;height:8px;border-radius:50%;
    background:rgba(255,190,60,.9);box-shadow:0 0 6px rgba(255,170,40,.6);cursor:pointer;
  }
  #clear-btn{
    background:none;border:1px solid rgba(180,210,255,.1);
    color:rgba(180,210,255,.25);font-family:'Space Mono',monospace;
    font-size:8px;letter-spacing:.25em;padding:4px 14px;cursor:pointer;transition:all .2s;
  }
  #clear-btn:hover{border-color:rgba(255,80,80,.4);color:rgba(255,80,80,.6)}
  #pcount{color:rgba(180,210,255,.18);font-size:8px;letter-spacing:.2em;min-width:60px}

  /* Gravity slider (top centre) */
  #grav-bar{
    position:fixed;z-index:900;
    top:20px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;
    font-family:'Space Mono',monospace;
    opacity:0;animation:fi 1s 2s ease forwards;
    pointer-events:auto;
  }
  #grav-bar .lbl{ font-size:8px;letter-spacing:.28em;color:rgba(255,180,60,.5); }
  #grav-slider{
    -webkit-appearance:none;appearance:none;
    width:120px;height:1px;
    background:linear-gradient(to right,rgba(255,140,20,.25),rgba(255,220,60,.5));
    border:none;outline:none;cursor:pointer;
  }
  #grav-slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:9px;height:9px;border-radius:50%;
    background:rgba(255,190,50,1);
    box-shadow:0 0 8px 2px rgba(255,160,30,.7);
    cursor:pointer;
  }
  #grav-val{
    color:rgba(255,180,60,.55);font-size:8px;letter-spacing:.15em;
    min-width:28px;text-align:left;
  }

  /* Speed bar (left) */
  #speed-bar{
    position:fixed;z-index:900;left:20px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:center;
    font-family:'Space Mono',monospace;user-select:none;
    opacity:0;animation:fi 1s 2s ease forwards;
  }
  .sp-btn{
    width:34px;height:34px;background:rgba(255,255,255,.03);
    border:1px solid rgba(80,220,160,.14);color:rgba(80,220,160,.5);
    font-size:14px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .15s;touch-action:manipulation;
  }
  #sp-fast{border-radius:5px 5px 0 0;border-bottom:none}
  #sp-slow{border-radius:0 0 5px 5px;border-top:none}
  .sp-btn:hover,.sp-btn:active{
    background:rgba(80,255,160,.1);border-color:rgba(80,255,160,.4);color:rgba(80,255,160,.9);
  }
  #sp-track{
    width:34px;height:130px;background:rgba(255,255,255,.03);
    border-left:1px solid rgba(80,220,160,.14);border-right:1px solid rgba(80,220,160,.14);
    position:relative;cursor:ns-resize;touch-action:none;
  }
  #sp-fill{
    position:absolute;bottom:0;left:0;right:0;pointer-events:none;
    background:linear-gradient(to top,rgba(60,255,140,.35),rgba(60,255,140,.07));
  }
  #sp-thumb{
    position:absolute;left:50%;transform:translate(-50%,-50%);
    width:20px;height:5px;border-radius:3px;pointer-events:none;
    background:rgba(60,255,140,.85);box-shadow:0 0 7px rgba(40,255,120,.5);
  }
  #sp-label{
    font-size:7px;letter-spacing:.08em;color:rgba(80,220,160,.32);text-align:center;
    padding:4px 0 2px;width:34px;
    border:1px solid rgba(80,220,160,.14);border-top:none;border-radius:0 0 4px 4px;
  }
  #sp-pause{
    margin-top:7px;width:34px;height:26px;background:rgba(255,255,255,.03);
    border:1px solid rgba(80,220,160,.14);border-radius:4px;
    color:rgba(80,220,160,.38);font-size:9px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .15s;
  }
  #sp-pause:hover{background:rgba(80,255,160,.08);border-color:rgba(80,255,160,.4);color:rgba(80,255,160,.9)}
  #sp-pause.paused{background:rgba(255,60,60,.07);border-color:rgba(255,60,60,.28);color:rgba(255,100,100,.8)}

  /* Zoom bar (right) */
  #zoom-bar{
    position:fixed;z-index:900;right:20px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:center;
    font-family:'Space Mono',monospace;user-select:none;
    opacity:0;animation:fi 1s 2s ease forwards;
  }
  .zm-btn{
    width:34px;height:34px;background:rgba(255,255,255,.03);
    border:1px solid rgba(180,210,255,.12);color:rgba(180,210,255,.5);
    font-size:15px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .15s;
  }
  #zm-in{border-radius:5px 5px 0 0;border-bottom:none}
  #zm-out{border-radius:0 0 5px 5px;border-top:none}
  .zm-btn:hover,.zm-btn:active{
    background:rgba(255,190,60,.1);border-color:rgba(255,190,60,.35);color:rgba(255,190,60,.9);
  }
  #zm-track{
    width:34px;height:130px;background:rgba(255,255,255,.03);
    border-left:1px solid rgba(180,210,255,.12);border-right:1px solid rgba(180,210,255,.12);
    position:relative;cursor:ns-resize;touch-action:none;
  }
  #zm-fill{
    position:absolute;bottom:0;left:0;right:0;pointer-events:none;
    background:linear-gradient(to top,rgba(255,190,60,.35),rgba(255,190,60,.07));
    transition:height .05s;
  }
  #zm-thumb{
    position:absolute;left:50%;transform:translate(-50%,-50%);
    width:20px;height:5px;border-radius:3px;pointer-events:none;
    background:rgba(255,190,60,.85);box-shadow:0 0 7px rgba(255,170,40,.5);
    transition:top .05s;
  }
  #zm-label{
    font-size:7px;letter-spacing:.08em;color:rgba(180,210,255,.28);text-align:center;
    padding:4px 0 2px;width:34px;
    border:1px solid rgba(180,210,255,.12);border-top:none;border-radius:0 0 4px 4px;
  }
  #zm-fit{
    margin-top:7px;width:34px;height:26px;background:rgba(255,255,255,.03);
    border:1px solid rgba(180,210,255,.12);border-radius:4px;
    color:rgba(180,210,255,.38);font-size:7px;letter-spacing:.06em;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .15s;
  }
  #zm-fit:hover{background:rgba(100,200,255,.08);border-color:rgba(100,200,255,.35);color:rgba(100,200,255,.9)}

  /* ========== NEW CONFIG MENU STYLES (added overlay) ========== */
  #config-btn{
    background:none;border:1px solid rgba(180,210,255,.1);
    color:rgba(180,210,255,.25);font-family:'Space Mono',monospace;
    font-size:8px;letter-spacing:.25em;padding:4px 14px;cursor:pointer;transition:all .2s;
  }
  #config-btn:hover{border-color:rgba(80,180,255,.6);color:rgba(80,180,255,.7)}
  #config-menu {
    position: fixed;
    z-index: 1000;
    bottom: 75px;
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    background: rgba(8, 8, 20, 0.94);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(80, 180, 255, 0.3);
    border-radius: 12px;
    font-family: 'Space Mono', monospace;
    padding: 14px 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    pointer-events: auto;
    transition: opacity 0.2s, transform 0.2s;
    opacity: 0;
    visibility: hidden;
    transform: translateX(-50%) scale(0.96);
  }
  #config-menu.open {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) scale(1);
  }
  .cfg-title {
    color: rgba(80, 200, 255, 0.9);
    font-size: 10px;
    letter-spacing: 0.2em;
    margin-bottom: 12px;
    text-align: center;
    border-bottom: 1px solid rgba(80,180,255,0.3);
    display: inline-block;
    width: 100%;
    padding-bottom: 6px;
  }
  .cfg-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 12px;
  }
  .cfg-row label {
    font-size: 7px;
    letter-spacing: 0.12em;
    color: rgba(200, 220, 255, 0.7);
    flex: 1;
  }
  .cfg-row input {
    flex: 2;
    width: auto;
    background: rgba(20,20,40,0.8);
    height: 2px;
  }
  .cfg-row span {
    font-size: 7px;
    color: rgba(255,190,80,0.8);
    min-width: 32px;
    text-align: right;
  }
  .cfg-reset {
    background: rgba(255,80,80,0.1);
    border: 1px solid rgba(255,80,80,0.3);
    color: rgba(255,120,120,0.8);
    font-size: 7px;
    padding: 5px 12px;
    margin-top: 8px;
    width: 100%;
    text-align: center;
    cursor: pointer;
    transition: 0.15s;
    border-radius: 20px;
  }
  .cfg-reset:hover {
    background: rgba(255,80,80,0.25);
    border-color: rgba(255,120,120,0.7);
    color: #ffaaaa;
  }
  @keyframes fi{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cursor"></div>
<div id="hint">HOLD·CHARGE — RELEASE·SPAWN — SCROLL·ZOOM — RIGHT-DRAG·PAN — F·FIT — SPACE·PAUSE</div>
<div id="speed-bar">
  <div class="sp-btn" id="sp-fast">▲</div>
  <div id="sp-track"><div id="sp-fill"></div><div id="sp-thumb"></div></div>
  <div class="sp-btn" id="sp-slow">▼</div>
  <div id="sp-label">1×</div>
  <div id="sp-pause">▐▐</div>
</div>
<div id="zoom-bar">
  <div class="zm-btn" id="zm-in">+</div>
  <div id="zm-track"><div id="zm-fill"></div><div id="zm-thumb"></div></div>
  <div class="zm-btn" id="zm-out">−</div>
  <div id="zm-label">8%</div>
  <div id="zm-fit">FIT</div>
</div>
<div id="grav-bar">
  <span class="lbl">☀ GRAVITY</span>
  <input type="range" id="grav-slider" min="0.05" max="2" value="1" step="0.05">
  <span id="grav-val">1.0×</span>
</div>
<div id="ui">
  <span class="lbl">SIZE</span>
  <input type="range" id="size-slider" min="1" max="10" value="5" step=".5">
  <button id="clear-btn">CLEAR</button>
  <button id="config-btn">⚙️</button>
  <span class="lbl" id="pcount">—</span>
</div>

<!-- NEW CONFIG MENU -->
<div id="config-menu">
  <div class="cfg-title">⚙️ PHYSICS TUNING</div>
  <div class="cfg-row"><label>GRAVITY CONST</label><input type="range" id="cfg-grav" min="40" max="240" value="120" step="2"><span id="cfg-grav-val">120</span></div>
  <div class="cfg-row"><label>SPRING STIFFNESS</label><input type="range" id="cfg-spring" min="0.1" max="1.2" value="0.40" step="0.01"><span id="cfg-spring-val">0.40</span></div>
  <div class="cfg-row"><label>DAMPING</label><input type="range" id="cfg-damp" min="0.96" max="1.0" value="1.0" step="0.001"><span id="cfg-damp-val">1.000</span></div>
  <div class="cfg-row"><label>SUBSTEPS</label><input type="range" id="cfg-substeps" min="4" max="16" value="8" step="1"><span id="cfg-substeps-val">8</span></div>
  <div class="cfg-row"><label>COLLISION RADIUS</label><input type="range" id="cfg-collr" min="0.8" max="2.0" value="1.15" step="0.01"><span id="cfg-collr-val">1.15</span></div>
  <div class="cfg-row"><label>PARTICLE RADIUS</label><input type="range" id="cfg-pr" min="1.5" max="5.0" value="2.8" step="0.1"><span id="cfg-pr-val">2.8</span></div>
  <div class="cfg-reset" id="cfg-reset-btn">⟳ RESET TO DEFAULTS</div>
</div>

<script>
// ============================================================================
// ORIGINAL VERLET WORLDS SIMULATION (solar-5.html) – EXACT COPY
// Only the following global constants have been replaced with 'let' 
// so the config menu can modify them. All other code is untouched.
// ============================================================================

// These were originally 'const' – now 'let' for mutability
let GRAV_CONST    = 120;
let SPRING_K      = 0.40;
let DAMPING       = 1.0;
let SUBSTEPS      = 8;
let PARTICLE_R    = 2.8;
let COLLISION_R   = PARTICLE_R * 1.15;
let LOOSE_HIT_R   = PARTICLE_R * 3.5;

// Keep original BREAK_MULT etc. as const
const BREAK_MULT  = 2.8;
const PHYS_SCALE  = 60;

// Helper function to update derived collision radii (called from config)
function updateCollisionRadius() {
  COLLISION_R = PARTICLE_R * 1.15;
  LOOSE_HIT_R = PARTICLE_R * 3.5;
}

// Sun gravity multiplier (already mutable in original via slider)
let sunGravMult = 1.0;

'use strict';

// ── Canvas & globals ───────────────────────────────────
const canvas   = document.getElementById('c');
const ctx      = canvas.getContext('2d');
const cursorEl = document.getElementById('cursor');
const slider   = document.getElementById('size-slider');
const pcountEl = document.getElementById('pcount');
const uiEl     = document.getElementById('ui');

let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;

const PI2 = Math.PI * 2;
const rnd  = Math.random.bind(Math);
const rndR = (a,b) => a+(b-a)*rnd();
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a+(b-a)*t;


// ── Physics constants ──────────────────────────────────

// ── Sun gravity multiplier (controlled by gravity slider) ──
// Minimum 0.05 so the sun always pulls a little.
const gravSlider = document.getElementById('grav-slider');
const gravVal    = document.getElementById('grav-val');
gravSlider.addEventListener('input', () => {
  sunGravMult = parseFloat(gravSlider.value);
  gravVal.textContent = sunGravMult.toFixed(2) + '×';
});

const SUN = {
  x:0, y:0,
  radius: 180,
  burnRadius: 220,
  mass: 182784,   // tuned: 20-sec orbit at dist=2000, nP=100
  coronaTime: 0,
};

// ── Palettes ───────────────────────────────────────────
const PALS = [
  {hi:'#ffeeaa',mid:'#ff8800',lo:'#5a1800',gc:'255,140,50'},
  {hi:'#cceeff',mid:'#0088ff',lo:'#001a44',gc:'60,180,255'},
  {hi:'#eeccff',mid:'#aa00ff',lo:'#1a0033',gc:'160,60,255'},
  {hi:'#aaffcc',mid:'#00cc66',lo:'#003322',gc:'40,200,120'},
  {hi:'#ffccee',mid:'#ff0077',lo:'#330011',gc:'255,60,140'},
  {hi:'#ffffaa',mid:'#ddcc00',lo:'#332200',gc:'220,200,60'},
];

// ── State ──────────────────────────────────────────────
let bodies = [];
let loose  = [];
let flashes = [];
let stars  = [];
let asteroids = [];   // comets / asteroid clusters
let astTimer  = 0;

// ── Comet palette ──────────────────────────────────
// Comets look bluish-white in space (reflected sunlight + ion tail)
const AST_PALETTE = [
  {fill:'#9c8e7a', outline:'#6b5e50', dot:'#c4b49a'}, // rocky tan
  {fill:'#7a8490', outline:'#505860', dot:'#a8b4bc'}, // grey silicate
  {fill:'#9a8840', outline:'#605420', dot:'#d4c870'}, // carbonaceous gold
  {fill:'#6a8890', outline:'#384858', dot:'#90b8c0'}, // icy blue-grey
];

const AST_SPAWN_INTERVAL = 600;  // ~10 sec between spawns at 1×
const AST_MAX            = 6;

function makeRockShape(r){
  const n=Math.floor(rndR(5,9));
  return Array.from({length:n},(_,i)=>{
    const baseA=(PI2/n)*i+(rnd()-0.5)*(PI2/n)*0.55;
    const rv=r*(0.55+rnd()*0.55);
    return [Math.cos(baseA)*rv, Math.sin(baseA)*rv];
  });
}

function spawnAsteroid(){
  if(asteroids.length>=AST_MAX) return;

  // Spawn far out — comet comes from the Oort cloud
  const spawnR = 10000+rndR(4000,10000);
  const fromA  = rnd()*PI2;
  const sx     = SUN.x+Math.cos(fromA)*spawnR;
  const sy     = SUN.y+Math.sin(fromA)*spawnR;

  // Fly in a random direction across the visible world — purely random, not sun-aimed.
  // Exit point is roughly opposite the spawn point with wide angular spread.
  const exitR = spawnR * rndR(0.7, 1.2);
  const exitA = fromA + Math.PI + rndR(-1.4, 1.4); // opposite side ±80°
  const ex    = SUN.x + Math.cos(exitA)*exitR;
  const ey    = SUN.y + Math.sin(exitA)*exitR;
  const aimA  = Math.atan2(ey-sy, ex-sx);

  // Fast enough to resist sun's gravitational pull — comets are passing bodies
  const speed = rndR(3.5, 7.0);
  const cvx   = Math.cos(aimA)*speed;
  const cvy   = Math.sin(aimA)*speed;

  const pal     = AST_PALETTE[Math.floor(rnd()*AST_PALETTE.length)];
  const nRocks  = Math.floor(rndR(3,9));
  const clusterR= rndR(8, 28); // smaller — comets are small nuclei

  const rocks = Array.from({length:nRocks},()=>{
    const ra=rnd()*PI2, rd=rnd()*clusterR;
    const rr=rndR(2, 6);
    return {
      ox:Math.cos(ra)*rd, oy:Math.sin(ra)*rd,
      dvx:(rnd()-0.5)*0.015, dvy:(rnd()-0.5)*0.015, // very slow drift
      r:rr, pts:makeRockShape(rr), angle:rnd()*PI2,
    };
  });

  const mass=rocks.reduce((s,r)=>s+r.r*r.r,0)*0.2;

  asteroids.push({
    x:sx, y:sy, vx:cvx, vy:cvy,
    rocks, clusterR, mass, pal,
    trail:[],        // stores world positions for tail
    tailLen:180,     // max trail points
    age:0,
  });
}

function tickAsteroids(dt){
  astTimer++;
  const spawnEvery=Math.max(120, AST_SPAWN_INTERVAL/physSpeed);
  if(astTimer>=spawnEvery){ astTimer=0; spawnAsteroid(); }

  for(let ai=asteroids.length-1; ai>=0; ai--){
    const a=asteroids[ai];
    a.age++;

    // Sun gravity
    const sdx=SUN.x-a.x, sdy=SUN.y-a.y;
    const sd2=sdx*sdx+sdy*sdy, sd=Math.sqrt(sd2)+.1;
    if(sd<SUN.burnRadius+a.clusterR){
      addNova(a.x,a.y,a.clusterR*5,'200,180,255');
      asteroids.splice(ai,1); continue;
    }
    // Sun gravity — comets are fast-moving bodies, keep influence minimal
    // so they don't get sucked in. 0.0015 = gentle deflection only.
    const sf=(GRAV_CONST*SUN.mass*sunGravMult/(sd2+500))*0.0015;
    a.vx+=sdx/sd*sf*dt; a.vy+=sdy/sd*sf*dt;

    // Planet gravity
    let hit=false;
    for(const b of bodies){
      const dx=b.cx-a.x, dy=b.cy-a.y;
      const d2=dx*dx+dy*dy, d=Math.sqrt(d2)+.1;
      const f=GRAV_CONST*b.mass*0.5/(d2+200);
      a.vx+=dx/d*f*dt; a.vy+=dy/d*f*dt;
      if(d<b.radius+a.clusterR*0.65){
        const spd=Math.hypot(a.vx,a.vy);
        const nx=(b.cx-a.x)/d, ny=(b.cy-a.y)/d;
        for(const p of b.particles){
          if(p.dead) continue;
          if(Math.hypot(p.x-a.x,p.y-a.y)<b.radius*0.7){
            p.heat=Math.min(1,p.heat+spd*.05);
            p.vx+=nx*spd*a.mass/b.mass*0.1;
            p.vy+=ny*spd*a.mass/b.mass*0.1;
          }
        }
        for(const rock of a.rocks){
          const ra=rnd()*PI2, rs=rndR(0.3,spd*0.4);
          loose.push({x:a.x+rock.ox,y:a.y+rock.oy,
            vx:a.vx+Math.cos(ra)*rs,vy:a.vy+Math.sin(ra)*rs,
            mass:rock.r*0.3,pal:{gc:'180,160,140'},heat:0.5,
            life:rndR(0.6,1),decay:rndR(.003,.008)});
        }
        addFlash(a.x,a.y,a.clusterR*5,'180,200,255');
        asteroids.splice(ai,1); hit=true; break;
      }
    }
    if(hit) continue;

    a.x+=a.vx*dt; a.y+=a.vy*dt;
    for(const rock of a.rocks){ rock.ox+=rock.dvx*dt; rock.oy+=rock.dvy*dt; }

    // Record trail point every frame
    a.trail.push({x:a.x, y:a.y});
    if(a.trail.length>a.tailLen) a.trail.shift();

    if(Math.hypot(a.x-SUN.x,a.y-SUN.y)>32000) asteroids.splice(ai,1);
  }
}

function drawAsteroids(){
  for(const a of asteroids){
    const sunDx=SUN.x-a.x, sunDy=SUN.y-a.y;
    const sunD =Math.hypot(sunDx,sunDy)||1;
    const tailNx=-sunDx/sunD, tailNy=-sunDy/sunD; // anti-sun unit vector

    // Tail length: fixed in SCREEN pixels → convert to world space
    // So it looks exactly the same regardless of zoom level
    const tailScreenPx  = 280;                        // px on screen
    const tailWorldLen  = tailScreenPx / cam.zoom;    // world-space equivalent

    // Ion tail — thin, blue-white, straight anti-sun
    ctx.save();
    const STEPS = 48;
    for(let i=1;i<=STEPS;i++){
      const f0=(i-1)/STEPS, f1=i/STEPS;
      const tx0=a.x+tailNx*tailWorldLen*f0, ty0=a.y+tailNy*tailWorldLen*f0;
      const tx1=a.x+tailNx*tailWorldLen*f1, ty1=a.y+tailNy*tailWorldLen*f1;
      // lineWidth in world coords = screen px / cam.zoom
      const ionW = Math.max(0.1/cam.zoom, (1-f1)*1.8/cam.zoom);
      ctx.beginPath(); ctx.moveTo(tx0,ty0); ctx.lineTo(tx1,ty1);
      ctx.strokeStyle=`rgba(160,205,255,${(1-f1)*(1-f1)*0.22})`;
      ctx.lineWidth=ionW; ctx.lineCap='round'; ctx.stroke();
    }

    // Dust tail — wider, warm, slight angular offset
    const dustA = Math.atan2(tailNy,tailNx)+0.13;
    const dnx=Math.cos(dustA), dny=Math.sin(dustA);
    const dustLen=tailWorldLen*0.75;
    for(let i=1;i<=32;i++){
      const f0=(i-1)/32, f1=i/32;
      const tx0=a.x+dnx*dustLen*f0, ty0=a.y+dny*dustLen*f0;
      const tx1=a.x+dnx*dustLen*f1, ty1=a.y+dny*dustLen*f1;
      const dw=Math.max(0.1/cam.zoom,(1-f1)*3.5/cam.zoom);
      ctx.beginPath(); ctx.moveTo(tx0,ty0); ctx.lineTo(tx1,ty1);
      ctx.strokeStyle=`rgba(220,200,155,${(1-f1)*(1-f1)*0.14})`;
      ctx.lineWidth=dw; ctx.lineCap='round'; ctx.stroke();
    }
    ctx.restore();

    // Coma — size fixed in screen px too
    const comaScreenR = 18;                           // px on screen
    const comaR       = comaScreenR / cam.zoom;
    const coma=ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,comaR);
    coma.addColorStop(0,  'rgba(210,228,255,0.28)');
    coma.addColorStop(0.5,'rgba(180,210,255,0.10)');
    coma.addColorStop(1,  'rgba(140,180,255,0)');
    ctx.fillStyle=coma;
    ctx.beginPath(); ctx.arc(a.x,a.y,comaR,0,PI2); ctx.fill();

    // Nucleus rocks — sizes are in world px (they scale naturally with zoom)
    // but we keep them small enough that they look like a tiny cluster at all zooms
    for(const rock of a.rocks){
      const wx=a.x+rock.ox, wy=a.y+rock.oy;
      ctx.save(); ctx.translate(wx,wy); ctx.rotate(rock.angle);
      ctx.beginPath();
      ctx.moveTo(rock.pts[0][0],rock.pts[0][1]);
      for(let i=1;i<rock.pts.length;i++) ctx.lineTo(rock.pts[i][0],rock.pts[i][1]);
      ctx.closePath();
      ctx.fillStyle  =a.pal.fill;
      ctx.strokeStyle=a.pal.outline;
      ctx.lineWidth  =0.6/cam.zoom;  // fixed 0.6px outline on screen
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.arc(-rock.r*0.22,-rock.r*0.22,Math.max(0.3/cam.zoom,rock.r*0.18),0,PI2);
      ctx.fillStyle='rgba(240,240,255,0.45)'; ctx.fill();
      ctx.restore();
    }
  }
}

// ── Stars ──────────────────────────────────────────────
function initStars(){
  stars = Array.from({length:180}, () => ({
    x:rnd()*W, y:rnd()*H, r:rnd()*1.2+.2,
    bri:rnd()*.5+.5, ts:rnd()*.012+.003, to:rnd()*PI2, hue:200+rnd()*60,
  }));
}
function drawStars(t){
  for(const s of stars){
    const a = s.bri*(.55+.45*Math.sin(t*s.ts+s.to));
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,PI2);
    ctx.fillStyle = `hsla(${s.hue},75%,95%,${a})`;
    ctx.shadowBlur = 3; ctx.shadowColor = `hsla(${s.hue},100%,95%,.3)`;
    ctx.fill(); ctx.shadowBlur = 0;
  }
}

// ── Flashes ────────────────────────────────────────────
function addFlash(x,y,r,gc){
  flashes.push({x,y, r:r*.05, maxR:r*3,  gc, life:0.55, speed:.14, kind:'ring'});
  flashes.push({x,y, r:r*.1,  maxR:r*2,  gc, life:0.45, speed:.12, kind:'fill'});
  flashes.push({x,y, r:0,     maxR:r*.8, gc, life:0.60, speed:.10, kind:'core'});
}

function addNova(x,y,r,gc){
  // White collapse circle fires first (starts at planet surface, fades fast)
  flashes.push({x,y, r:r*.9,  maxR:r*1.6, gc, life:0.9, speed:.18, kind:'white'});
  // Then the explosion layers follow
  flashes.push({x,y, r:r*.04, maxR:r*3.5, gc, life:0.70, speed:.11, kind:'ring'});
  flashes.push({x,y, r:r*.08, maxR:r*2.2, gc, life:0.55, speed:.10, kind:'fill'});
  flashes.push({x,y, r:r*.15, maxR:r*1.3, gc, life:0.65, speed:.09, kind:'fill'});
  flashes.push({x,y, r:0,     maxR:r*.9,  gc, life:0.75, speed:.08, kind:'core'});
}

function drawFlashes(){
  flashes = flashes.filter(f=>f.life>0);
  for(const f of flashes){
    const r = Math.max(.1, f.r);
    const a = clamp(f.life, 0, 1);

    if(f.kind==='white'){
      // Solid white circle that contracts and fades — the "death flash"
      const gr = ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
      gr.addColorStop(0,   `rgba(255,255,255,${a*.30})`);
      gr.addColorStop(0.5, `rgba(255,250,240,${a*.16})`);
      gr.addColorStop(0.85,`rgba(255,240,200,${a*.06})`);
      gr.addColorStop(1,   `rgba(255,255,255,0)`);
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(f.x,f.y,r,0,PI2); ctx.fill();
      // Crisp white rim
      ctx.beginPath(); ctx.arc(f.x,f.y,r,0,PI2);
      ctx.strokeStyle=`rgba(255,255,255,${a*.22})`;
      ctx.lineWidth=Math.max(.3,r*.04/cam.zoom); ctx.stroke();

    } else if(f.kind==='ring'){
      ctx.beginPath(); ctx.arc(f.x,f.y,r,0,PI2);
      ctx.strokeStyle=`rgba(${f.gc},${a*.22})`;
      ctx.lineWidth=Math.max(.3,(f.maxR*.025)/cam.zoom)*a;
      ctx.stroke();
      const gr=ctx.createRadialGradient(f.x,f.y,Math.max(0,r*.75),f.x,f.y,r*1.35);
      gr.addColorStop(0,`rgba(${f.gc},${a*.08})`);
      gr.addColorStop(1,`rgba(${f.gc},0)`);
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(f.x,f.y,r*1.35,0,PI2); ctx.fill();

    } else if(f.kind==='fill'){
      const gr=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
      gr.addColorStop(0,   `rgba(255,240,200,${a*.13})`);
      gr.addColorStop(0.4, `rgba(${f.gc},${a*.09})`);
      gr.addColorStop(0.8, `rgba(${f.gc},${a*.03})`);
      gr.addColorStop(1,   `rgba(${f.gc},0)`);
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(f.x,f.y,r,0,PI2); ctx.fill();

    } else if(f.kind==='core'){
      const gr=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);
      gr.addColorStop(0,   `rgba(255,255,255,${a*.40})`);
      gr.addColorStop(0.35,`rgba(255,230,150,${a*.20})`);
      gr.addColorStop(0.7, `rgba(${f.gc},${a*.08})`);
      gr.addColorStop(1,   `rgba(${f.gc},0)`);
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(f.x,f.y,r,0,PI2); ctx.fill();
    }

    f.r    += (f.maxR-f.r)*f.speed;
    f.life -= .042; // faster decay overall
  }
}

// ── Nebula ─────────────────────────────────────────────
function drawNebula(t){
  const blobs = [
    [W*.2,  H*.3,  Math.max(W,H)*.7,  8,  6, 38, .04 ],
    [W*.78, H*.7,  Math.max(W,H)*.6,  28, 4, 18, .035],
    [W*.5,  H*.15, Math.max(W,H)*.5,  4, 12, 40, .03 ],
    [W*.85, H*.4,  Math.max(W,H)*.45, 12, 3, 30, .025],
    [W*.1,  H*.75, Math.max(W,H)*.5,  6, 20, 12, .02 ],
  ];
  for(const [bx,by,br,r,g,b,a] of blobs){
    const px = bx+Math.sin(t*.00007)*30, py = by+Math.cos(t*.00009)*20;
    const grd = ctx.createRadialGradient(px,py,0,px,py,br);
    grd.addColorStop(0,`rgba(${r},${g},${b},${a})`);
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);
  }
}

const cam = { x:0, y:0, zoom:0.08, targetZoom:0.08, minZoom:0.01, maxZoom:4 };

const screenToWorld = (sx,sy) => ({
  x: cam.x+(sx-W/2)/cam.zoom,
  y: cam.y+(sy-H/2)/cam.zoom,
});
const applyCam = () => {
  ctx.translate(W/2,H/2);
  ctx.scale(cam.zoom,cam.zoom);
  ctx.translate(-cam.x,-cam.y);
};
const tickCam = () => { cam.zoom += (cam.targetZoom-cam.zoom)*.1; };

// Scroll zoom toward cursor
window.addEventListener('wheel', e => {
  e.preventDefault();
  const factor  = e.deltaY<0 ? 1.12 : 1/1.12;
  const newZoom = clamp(cam.targetZoom*factor, cam.minZoom, cam.maxZoom);
  const wb      = screenToWorld(e.clientX, e.clientY);
  cam.targetZoom = newZoom;
  cam.x = wb.x-(e.clientX-W/2)/newZoom;
  cam.y = wb.y-(e.clientY-H/2)/newZoom;
}, {passive:false});

// Right-click / middle-drag to pan
let panning=false, panStart={x:0,y:0}, camStart={x:0,y:0};
window.addEventListener('mousedown', e => {
  if(e.button===1||e.button===2){
    panning=true; panStart={x:e.clientX,y:e.clientY}; camStart={x:cam.x,y:cam.y};
    e.preventDefault();
  }
});
window.addEventListener('mousemove', e => {
  if(panning){ cam.x=camStart.x-(e.clientX-panStart.x)/cam.zoom; cam.y=camStart.y-(e.clientY-panStart.y)/cam.zoom; }
});
window.addEventListener('mouseup',      e => { if(e.button===1||e.button===2) panning=false; });
window.addEventListener('contextmenu',  e => e.preventDefault());

function frameBodies(){
  const pad=300;
  let minX=-SUN.radius*6, maxX=SUN.radius*6, minY=-SUN.radius*6, maxY=SUN.radius*6;
  for(const b of bodies){
    minX=Math.min(minX,b.cx-b.radius); maxX=Math.max(maxX,b.cx+b.radius);
    minY=Math.min(minY,b.cy-b.radius); maxY=Math.max(maxY,b.cy+b.radius);
  }
  cam.x=(minX+maxX)/2; cam.y=(minY+maxY)/2;
  cam.targetZoom=clamp(Math.min(W/(maxX-minX+pad*2),H/(maxY-minY+pad*2)),cam.minZoom,cam.maxZoom);
}

// Keyboard shortcuts
window.addEventListener('keydown', e => {
  if(e.key==='='||e.key==='+') cam.targetZoom=clamp(cam.targetZoom*1.2,cam.minZoom,cam.maxZoom);
  if(e.key==='-')               cam.targetZoom=clamp(cam.targetZoom/1.2,cam.minZoom,cam.maxZoom);
  if(e.key==='0'||e.key==='r')  { cam.targetZoom=1; cam.x=0; cam.y=0; }
  if(e.key==='f')               frameBodies();
  if(e.key===' '||e.key==='p')  { e.preventDefault(); togglePause(); }
  if(e.key===']') setSpeed(physSpeed+0.5);
  if(e.key==='[') setSpeed(physSpeed-0.5);
});

let pinchDist0=0, pinchZoom0=1, pinchMidX=0, pinchMidY=0;
canvas.addEventListener('touchstart', e => {
  if(e.touches.length===2){
    const a=e.touches[0], b=e.touches[1];
    pinchDist0=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
    pinchZoom0=cam.targetZoom;
    pinchMidX=(a.clientX+b.clientX)/2; pinchMidY=(a.clientY+b.clientY)/2;
    e.preventDefault();
  } else if(e.touches.length===1&&!holding){
    const t=e.touches[0]; tx=t.clientX; ty=t.clientY;
    holding=true; holdT=performance.now(); cursorEl.classList.add('holding');
    e.preventDefault();
  }
},{passive:false});
canvas.addEventListener('touchmove', e => {
  if(e.touches.length===2){
    const a=e.touches[0], b=e.touches[1];
    const dist=Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
    const newZoom=clamp(pinchZoom0*dist/pinchDist0,cam.minZoom,cam.maxZoom);
    const wb=screenToWorld(pinchMidX,pinchMidY);
    cam.targetZoom=newZoom; cam.x=wb.x-(pinchMidX-W/2)/newZoom; cam.y=wb.y-(pinchMidY-H/2)/newZoom;

// ══════════════════════════════════════════════════════
//  PHYSICS ENGINE  (Symplectic Euler, explicit vx/vy)
// ══════════════════════════════════════════════════════

function makeParticle(x,y,mass,pal,isCore){
  return { x,y, vx:0,vy:0, fx:0,fy:0, mass:mass||1, pal, isCore:!!isCore,
           body:null, dead:false, heat:0 };
}

function makeSpring(a,b,restLen,stiff,breakAt){
  return { a,b, restLen, stiff:stiff||SPRING_K,
           breakAt:breakAt||(restLen*BREAK_MULT), broken:false };
}

function makeBody(cx,cy,radius,pal){
  const particles=[],springs=[],grid={};
  const spacing=PARTICLE_R*1.82;
  const rows=Math.ceil(radius/spacing)*2+1, cols=rows;
  const ox=cx-(cols-1)*spacing*.5, oy=cy-(rows-1)*spacing*.5;

  for(let row=0;row<rows;row++){
    for(let col=0;col<cols;col++){
      const px=ox+col*spacing+(row%2)*.5*spacing, py=oy+row*spacing;
      const dx=px-cx,dy=py-cy;
      if(Math.sqrt(dx*dx+dy*dy)>radius+spacing*.3) continue;
      const p=makeParticle(px,py,1,pal,Math.sqrt(dx*dx+dy*dy)<radius*.3);
      grid[`${col},${row}`]=particles.length;
      particles.push(p);
    }
  }
  const dirs=[[1,0],[0,1],[1,1],[-1,1],[2,0],[0,2]],seen=new Set();
  for(let row=0;row<rows;row++){
    for(let col=0;col<cols;col++){
      const ai=grid[`${col},${row}`]; if(ai===undefined) continue;
      for(const [dc,dr] of dirs){
        const bi=grid[`${col+dc},${row+dr}`]; if(bi===undefined) continue;
        const key=ai<bi?`${ai}-${bi}`:`${bi}-${ai}`;
        if(seen.has(key)) continue; seen.add(key);
        const pa=particles[ai],pb=particles[bi];
        const len=Math.hypot(pb.x-pa.x,pb.y-pa.y);
        const isDirect=len<spacing*1.2;
        springs.push(makeSpring(ai,bi,len,
          isDirect?SPRING_K:SPRING_K*.6,
          isDirect?len*BREAK_MULT:len*BREAK_MULT*.8));
      }
    }
  }
  for(const p of particles){
    const d=Math.hypot(p.x-cx,p.y-cy)/radius;
    p.mass=lerp(2.0,0.6,d);
  }
  const body={particles,springs,pal,cx,cy,mass:0,radius,dead:false,
              gravMult:sunGravMult}; // snapshot gravity at spawn — changing slider later won't redirect
  let tm=0; for(const p of particles){p.body=body;tm+=p.mass}
  body.mass=tm; return body;
}

function updateCOM(body){
  let sx=0,sy=0,sm=0;
  for(const p of body.particles){
    if(p.dead) continue;
    sx+=p.x*p.mass; sy+=p.y*p.mass; sm+=p.mass;
  }
  if(sm>0){ body.cx=sx/sm; body.cy=sy/sm; body.mass=sm; }
}

function integrateParticle(p,dt){
  if(p.dead) return;
  p.vx=(p.vx+p.fx/p.mass*dt)*DAMPING;
  p.vy=(p.vy+p.fy/p.mass*dt)*DAMPING;
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  p.fx=0; p.fy=0;
}

function solveSprings(body,dt){
  const {particles:ps,springs:ss}=body;
  for(const sp of ss){
    if(sp.broken) continue;
    const pa=ps[sp.a],pb=ps[sp.b];
    if(pa.dead||pb.dead){sp.broken=true;continue}
    const dx=pb.x-pa.x,dy=pb.y-pa.y;
    const len=Math.hypot(dx,dy)||.001;
    if(len>sp.breakAt){sp.broken=true;continue}
    const f=sp.stiff*(len-sp.restLen), nx=dx/len, ny=dy/len;
    const tm=pa.mass+pb.mass;
    pa.vx+=nx*f*(pb.mass/tm)*dt; pa.vy+=ny*f*(pb.mass/tm)*dt;
    pb.vx-=nx*f*(pa.mass/tm)*dt; pb.vy-=ny*f*(pa.mass/tm)*dt;
  }
}

function applyGravity(p,nParticles){
  // Use body's snapshotted gravMult so slider changes after spawn don't redirect orbit
  const gm = (p.body && p.body.gravMult!=null) ? p.body.gravMult : sunGravMult;
  const sdx=SUN.x-p.x,sdy=SUN.y-p.y;
  const sd2=sdx*sdx+sdy*sdy,sd=Math.sqrt(sd2)+.1;
  const sf=(GRAV_CONST*SUN.mass*gm/(sd2+500))/nParticles;
  p.fx+=sdx/sd*sf*p.mass; p.fy+=sdy/sd*sf*p.mass;
  for(const b of bodies){
    if(p.body===b) continue;
    const dx=b.cx-p.x,dy=b.cy-p.y;
    const d2=dx*dx+dy*dy,d=Math.sqrt(d2)+.1;
    const f=(GRAV_CONST*b.mass/(d2+300))/nParticles;
    p.fx+=dx/d*f*p.mass; p.fy+=dy/d*f*p.mass;
  }
}

function interBodyCollisions(){
  for(let bi=0;bi<bodies.length;bi++){
    for(let bj=bi+1;bj<bodies.length;bj++){
      const A=bodies[bi],B=bodies[bj];
      const cdx=A.cx-B.cx,cdy=A.cy-B.cy;
      const cd2=cdx*cdx+cdy*cdy;
      const thresh=A.radius+B.radius+COLLISION_R*4;
      if(cd2>thresh*thresh) continue;

      // ── Grid-based broad phase ──
      // Bin particles into a cell grid; only check cross-body pairs in same cell
      const cellSize=COLLISION_R*2;
      const grid=new Map();
      const addCell=(p,tag)=>{
        const cx=Math.floor(p.x/cellSize), cy=Math.floor(p.y/cellSize);
        const key=cx+','+cy;
        if(!grid.has(key)) grid.set(key,[]);
        grid.get(key).push({p,tag});
      };
      for(const p of A.particles) if(!p.dead) addCell(p,0);
      for(const p of B.particles) if(!p.dead) addCell(p,1);

      for(const cell of grid.values()){
        let hasA=false,hasB=false;
        for(const e of cell){if(e.tag===0)hasA=true;else hasB=true;if(hasA&&hasB)break}
        if(!hasA||!hasB) continue;
        for(const ea of cell){
          if(ea.tag!==0) continue;
          const pa=ea.p;
          for(const eb of cell){
            if(eb.tag!==1) continue;
            const pb=eb.p;
            const dx=pb.x-pa.x,dy=pb.y-pa.y;
            const d2=dx*dx+dy*dy;
            if(d2>=COLLISION_R*COLLISION_R) continue;
            const d=Math.sqrt(d2)||.001,nx=dx/d,ny=dy/d;
            const ov=COLLISION_R-d,ma=pa.mass,mb=pb.mass,mt=ma+mb;
            pa.x-=nx*ov*(mb/mt); pa.y-=ny*ov*(mb/mt);
            pb.x+=nx*ov*(ma/mt); pb.y+=ny*ov*(ma/mt);
            const vn=(pa.vx-pb.vx)*nx+(pa.vy-pb.vy)*ny;
            if(vn<0){
              const j=-(1+0.45)*vn/(1/ma+1/mb);
              pa.vx+=j*nx/ma; pa.vy+=j*ny/ma;
              pb.vx-=j*nx/mb; pb.vy-=j*ny/mb;
              pa.heat=clamp(pa.heat+Math.abs(vn)*.15,0,1);
              pb.heat=clamp(pb.heat+Math.abs(vn)*.15,0,1);
            }
          }
        }
      }
    }
  }
}

// ── Planetary ring formation ─────────────────────────
// When a large planet dies, spawn a ring of debris orbiting the sun
// at the planet's last position. Minimum radius threshold: 40px.
const RING_MIN_RADIUS = 40;
const RING_PARTICLES  = 80;   // number of ring debris points

function spawnRing(body){
  const rx   = body.cx, ry = body.cy;
  const dist = Math.hypot(rx-SUN.x, ry-SUN.y) || 1;

  // Ring width: proportional to body size
  const ringW = body.radius * 0.6;

  // Flash at body centre
  addFlash(rx, ry, body.radius*4, body.pal.gc);
  addNova(rx, ry, body.radius*3, body.pal.gc);

  for(let i=0; i<RING_PARTICLES; i++){
    const angle = PI2/RING_PARTICLES * i + rndR(-0.05, 0.05);
    // Position: spread radially around the orbit radius
    const r     = dist + rndR(-ringW, ringW);
    const px    = SUN.x + Math.cos(angle)*r;
    const py    = SUN.y + Math.sin(angle)*r;

    // Tangential orbital velocity at this radius (CCW)
    const gmLocal = GRAV_CONST * SUN.mass * (body.gravMult||sunGravMult);
    const vLocal  = Math.sqrt(gmLocal / Math.max(r,1));
    const scatter = rndR(0.96, 1.04); // slight speed variation for ring spread
    const vx = -Math.sin(angle) * vLocal * scatter;
    const vy  =  Math.cos(angle) * vLocal * scatter;

    loose.push({
      x:px, y:py, vx, vy,
      mass:  rndR(0.4, 1.2),
      pal:   body.pal,
      heat:  rndR(0.3, 0.8),
      life:  rndR(0.7, 1.0),
      decay: rndR(0.0005, 0.002),  // ring debris lives a long time
      isRing: true,
    });
  }
}

function splitDeadParticles(body){
  const {particles:ps,springs:ss}=body;
  const n=ps.length; if(!n) return;
  const adj=Array.from({length:n},()=>[]);
  for(const sp of ss)
    if(!sp.broken&&!ps[sp.a].dead&&!ps[sp.b].dead){adj[sp.a].push(sp.b);adj[sp.b].push(sp.a)}
  const vis=new Uint8Array(n);
  let seed=-1; for(let i=0;i<n;i++){if(!ps[i].dead){seed=i;break}}
  if(seed===-1) return;
  const q=[seed]; vis[seed]=1;
  while(q.length){ const c=q.shift(); for(const nb of adj[c]) if(!vis[nb]){vis[nb]=1;q.push(nb)} }
  let alive=0;
  for(let i=0;i<n;i++){
    const p=ps[i];
    if(p.dead) continue;
    if(!vis[i]){
      loose.push({x:p.x,y:p.y,vx:p.vx,vy:p.vy,mass:p.mass,pal:p.pal,heat:p.heat,life:1,decay:rndR(.004,.008)});
      p.dead=true;
    } else {
      alive++;
    }
  }
  if(alive<Math.max(3,n*.08)){
    for(const p of ps) if(!p.dead)
      loose.push({x:p.x,y:p.y,vx:p.vx,vy:p.vy,mass:p.mass,pal:p.pal,heat:1,life:1,decay:rndR(.005,.01)});
    // Spawn ring if planet was large enough
    if(body.radius >= RING_MIN_RADIUS) spawnRing(body);
    body.dead=true;
  }
}

function looseVsPlanets(){
  // Cap loose particles checked per frame to avoid O(loose×particles) blowup
  const MAX_LOOSE_CHECKS=200;
  const step=loose.length>MAX_LOOSE_CHECKS?Math.floor(loose.length/MAX_LOOSE_CHECKS):1;
  for(let li=loose.length-1;li>=0;li-=step){
    const lp=loose[li]; if(lp.life<=0) continue;
    for(const body of bodies){
      const bdx=body.cx-lp.x,bdy=body.cy-lp.y;
      const bd2=bdx*bdx+bdy*bdy;
      const thresh=body.radius+LOOSE_HIT_R*2;
      if(bd2>thresh*thresh) continue;
      // Only scan surface-layer particles (those within 1.5×PARTICLE_R of the hull)
      let nearP=null, nearD2=Infinity;
      for(const bp of body.particles){
        if(bp.dead) continue;
        const dx=bp.x-lp.x,dy=bp.y-lp.y;
        const d2=dx*dx+dy*dy;
        if(d2<nearD2){nearD2=d2;nearP=bp}
      }
      const nearD=Math.sqrt(nearD2);
      if(!nearP||nearD>LOOSE_HIT_R) continue;
      const dx=nearP.x-lp.x,dy=nearP.y-lp.y,d=Math.hypot(dx,dy)||.001;
      const nx=dx/d,ny=dy/d;
      const vn=(lp.vx-nearP.vx)*nx+(lp.vy-nearP.vy)*ny;
      if(Math.abs(vn)<0.8){
        nearP.vx+=lp.vx*lp.mass/nearP.mass*.3;
        nearP.vy+=lp.vy*lp.mass/nearP.mass*.3;
        nearP.heat=Math.min(1,nearP.heat+.25);
        lp.life=0;
      } else if(vn>0){
        lp.x-=nx*(LOOSE_HIT_R-nearD)*.9; lp.y-=ny*(LOOSE_HIT_R-nearD)*.9;
        const ma=lp.mass,mb=nearP.mass;
        const j=-(1+0.55)*vn/(1/ma+1/mb);
        lp.vx-=j*nx/ma; lp.vy-=j*ny/ma;
        nearP.vx+=j*nx/mb; nearP.vy+=j*ny/mb;
        const h=clamp(Math.abs(vn)*.12,0,1);
        lp.heat=Math.min(1,lp.heat+h); nearP.heat=Math.min(1,nearP.heat+h*1.5);
        if(Math.abs(vn)>2){
          for(let k=0;k<3;k++){
            const a=Math.atan2(-ny,-nx)+(rnd()-.5)*1.2;
            const s=rnd()*Math.abs(vn)*.4+.5;
            loose.push({x:lp.x,y:lp.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
              mass:lp.mass*.15,pal:lp.pal,heat:.8,life:.6,decay:rndR(.02,.04)});
          }
        }
      }
      break;
    }
  }
}

function tickLoose(dt){
  // Cap loose array to prevent unbounded growth
  if(loose.length>400) loose.splice(0,loose.length-400);
  loose=loose.filter(p=>p.life>0);
  for(const p of loose){
    const sdx=SUN.x-p.x,sdy=SUN.y-p.y;
    const sd2=sdx*sdx+sdy*sdy,sd=Math.sqrt(sd2)+.1;
    if(sd<SUN.burnRadius){p.life=0;continue}
    const sf=GRAV_CONST*SUN.mass*sunGravMult/(sd2+500)*.04;
    p.vx+=sdx/sd*sf*dt; p.vy+=sdy/sd*sf*dt;
    for(const b of bodies){
      const dx=b.cx-p.x,dy=b.cy-p.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2)+.1;
      const f=GRAV_CONST*b.mass*(p.isRing?0.01:0.12)/(d2+150);
      p.vx+=dx/d*f*dt; p.vy+=dy/d*f*dt;
    }
    p.vx*=.997; p.vy*=.997;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.heat=sd<SUN.burnRadius*3?Math.min(1,p.heat+.02*dt):Math.max(0,p.heat-.005*dt);
    p.life-=p.decay*dt;
  }
}

function tickBodies(scaledDt){
  const dt=scaledDt/SUBSTEPS;
  // Count alive particles once, not via .filter (avoids array alloc per substep)
  const nAlives=bodies.map(b=>{let n=0;for(const p of b.particles) if(!p.dead)n++;return n||1});
  for(let sub=0;sub<SUBSTEPS;sub++){
    for(let bi=0;bi<bodies.length;bi++){
      const body=bodies[bi],na=nAlives[bi];
      for(const p of body.particles){if(!p.dead) applyGravity(p,na)}
    }
    for(const body of bodies) for(const p of body.particles) integrateParticle(p,dt);
    for(const body of bodies) solveSprings(body,dt);
    for(const body of bodies) for(const p of body.particles){
      if(p.dead) continue;
      const dx=SUN.x-p.x,dy=SUN.y-p.y,sd2=dx*dx+dy*dy;
      if(sd2<SUN.burnRadius*SUN.burnRadius){p.dead=true;p.heat=1}
      else if(sd2<SUN.burnRadius*SUN.burnRadius*6.25) p.heat=Math.min(1,p.heat+.04);
    }
    if(sub===SUBSTEPS-1) interBodyCollisions();
  }
  for(const body of bodies) updateCOM(body);
  for(const body of bodies) splitDeadParticles(body);
  bodies=bodies.filter(b=>!b.dead);
  looseVsPlanets();
}

// ══════════════════════════════════════════════════════
//  DRAWING
// ══════════════════════════════════════════════════════

function drawLoose(){
  const hot=[],warm=[],cool=new Map(),ring=new Map();
  for(const p of loose){
    const life=Math.min(p.life,1);
    const r=Math.max(.01, PARTICLE_R*(p.isRing?1.4:1)*life);
    const a=life;
    if(p.isRing){
      // Ring particles: slightly glowing, keyed by palette
      const key=p.pal.gc;
      if(!ring.has(key)) ring.set(key,[]);
      ring.get(key).push([p.x,p.y,r,a*0.85]);
    } else if(p.heat>.6){
      hot.push([p.x,p.y,r,a*.9]);
    } else if(p.heat>.3){
      warm.push([p.x,p.y,r,a*.85]);
    } else {
      const key=p.pal.gc;
      if(!cool.has(key)) cool.set(key,[]);
      cool.get(key).push([p.x,p.y,r,a*.8]);
    }
  }
  const drawBatch=(style,arr)=>{
    if(!arr.length) return;
    ctx.fillStyle=style;
    for(const [x,y,r,a] of arr){ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,r,0,PI2);ctx.fill()}
  };
  // Ring particles — subtle shimmer via shadowBlur (small batch, worth it)
  for(const [gc,pts] of ring){
    ctx.shadowBlur=3; ctx.shadowColor=`rgba(${gc},.6)`;
    drawBatch(`rgba(${gc},1)`, pts);
    ctx.shadowBlur=0;
  }
  drawBatch('rgba(255,220,80,1)', hot);
  drawBatch('rgba(255,100,30,1)', warm);
  for(const [gc,pts] of cool) drawBatch(`rgba(${gc},1)`, pts);
  ctx.globalAlpha=1;
}

function convexHull(pts){
  if(pts.length<3) return pts;
  let lo=pts[0];
  for(const p of pts) if(p.y>lo.y||(p.y===lo.y&&p.x<lo.x)) lo=p;
  const hull=[lo]; let cur=lo;
  while(true){
    let next=pts[0];
    for(const p of pts){
      if(p===cur) continue;
      const cross=(next.x-cur.x)*(p.y-cur.y)-(next.y-cur.y)*(p.x-cur.x);
      if(cross<0||(cross===0&&Math.hypot(p.x-cur.x,p.y-cur.y)>Math.hypot(next.x-cur.x,next.y-cur.y))) next=p;
    }
    if(next===lo) break;
    hull.push(next); cur=next;
    if(hull.length>pts.length) break;
  }
  return hull;
}

function drawBody(body){
  const {particles:ps,springs:ss,pal}=body;
  // Avoid .filter() allocation — manual loop
  const alive=[];
  for(const p of ps) if(!p.dead) alive.push(p);
  if(alive.length<3) return;

  const hull=convexHull(alive);
  if(hull.length>2){
    ctx.save();
    ctx.beginPath(); ctx.moveTo(hull[0].x,hull[0].y);
    for(let i=1;i<hull.length;i++) ctx.lineTo(hull[i].x,hull[i].y);
    ctx.closePath();
    const gr=ctx.createRadialGradient(body.cx,body.cy,0,body.cx,body.cy,body.radius);
    gr.addColorStop(0,pal.hi+'dd'); gr.addColorStop(0.35,pal.mid+'cc');
    gr.addColorStop(0.75,pal.lo+'bb'); gr.addColorStop(1,pal.lo+'44');
    ctx.fillStyle=gr; ctx.fill();
    ctx.strokeStyle=`rgba(${pal.gc},.35)`;
    ctx.lineWidth=1.5/cam.zoom; ctx.stroke();
    ctx.restore();
  }

  // Stressed springs — single batched path
  ctx.save(); ctx.globalAlpha=.08; ctx.strokeStyle=`rgba(${pal.gc},.9)`;
  ctx.lineWidth=.8/cam.zoom; ctx.beginPath();
  for(const sp of ss){
    if(sp.broken) continue;
    const pa=ps[sp.a],pb=ps[sp.b]; if(pa.dead||pb.dead) continue;
    if(Math.hypot(pb.x-pa.x,pb.y-pa.y)/sp.restLen<1.1) continue;
    ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y);
  }
  ctx.stroke(); ctx.restore();

  // Cool particles — one big batched path (no shadowBlur, eliminates GPU cost)
  ctx.fillStyle=`rgba(${pal.gc},.75)`;
  ctx.beginPath();
  for(const p of alive){
    if(p.heat>.05) continue;
    const r=p.isCore?PARTICLE_R*1.3:PARTICLE_R;
    ctx.moveTo(p.x+r,p.y); ctx.arc(p.x,p.y,r,0,PI2);
    p.heat=Math.max(0,p.heat-.012);
  }
  ctx.fill();

  // Hot particles — small batch, individual draws
  for(const p of alive){
    if(p.heat<=.05) continue;
    const r=p.isCore?PARTICLE_R*1.3:PARTICLE_R;
    ctx.fillStyle=`rgba(255,${Math.floor(lerp(60,220,p.heat))},30,${p.heat*.9})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,PI2); ctx.fill();
    p.heat=Math.max(0,p.heat-.012);
  }

  // Atmosphere halo
  const atm=ctx.createRadialGradient(body.cx,body.cy,body.radius*.7,body.cx,body.cy,body.radius*1.8);
  atm.addColorStop(0,`rgba(${pal.gc},.08)`); atm.addColorStop(1,`rgba(${pal.gc},0)`);
  ctx.fillStyle=atm; ctx.beginPath(); ctx.arc(body.cx,body.cy,body.radius*1.8,0,PI2); ctx.fill();
}

function drawSun(t){
  const {x,y,radius}=SUN;
  SUN.coronaTime+=.008;
  const ct=SUN.coronaTime;

  // Halos
  for(const [r,a,sp] of [[radius*5.5,.015,.0011],[radius*3.8,.03,.0017],[radius*2.5,.055,.002],[radius*1.7,.09,.0025]]){
    const pulse=1+.06*Math.sin(ct*sp*1000);
    const gr=ctx.createRadialGradient(x,y,radius*.6,x,y,r*pulse);
    gr.addColorStop(0,`rgba(255,200,60,${a})`); gr.addColorStop(.4,`rgba(255,120,20,${a*.4})`); gr.addColorStop(1,'rgba(255,60,0,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r*pulse,0,PI2); ctx.fill();
  }

  // Flares
  ctx.save();
  for(let i=0;i<12;i++){
    const angle=PI2/12*i+Math.sin(ct*.7+i)*.15;
    const flicker=Math.sin(ct*1.3+i*2.1)*.5+.5;
    const len=radius*(.35+flicker*.55);
    const tipX=x+Math.cos(angle)*(radius+len),tipY=y+Math.sin(angle)*(radius+len);
    const lx=x+Math.cos(angle-Math.PI/2)*radius*.12,ly=y+Math.sin(angle-Math.PI/2)*radius*.12;
    const rx=x+Math.cos(angle+Math.PI/2)*radius*.12,ry=y+Math.sin(angle+Math.PI/2)*radius*.12;
    const fg=ctx.createLinearGradient(x,y,tipX,tipY);
    fg.addColorStop(0,`rgba(255,230,100,${.25*flicker})`); fg.addColorStop(.5,`rgba(255,140,30,${.15*flicker})`); fg.addColorStop(1,'rgba(255,60,0,0)');
    ctx.beginPath(); ctx.moveTo(lx,ly);
    ctx.quadraticCurveTo(tipX+Math.cos(angle)*radius*.1,tipY+Math.sin(angle)*radius*.1,rx,ry);
    ctx.quadraticCurveTo(x+Math.cos(angle)*radius*.7,y+Math.sin(angle)*radius*.7,lx,ly);
    ctx.fillStyle=fg; ctx.fill();
  }
  ctx.restore();

  // Sphere
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,radius,0,PI2); ctx.clip();
  const bg=ctx.createRadialGradient(x-radius*.2,y-radius*.2,0,x,y,radius);
  bg.addColorStop(0,'#fffde0'); bg.addColorStop(.15,'#ffe066'); bg.addColorStop(.45,'#ff9900'); bg.addColorStop(.8,'#ff4400'); bg.addColorStop(1,'#cc1100');
  ctx.fillStyle=bg; ctx.fillRect(x-radius,y-radius,radius*2,radius*2);
  // Granulation
  for(let i=0;i<28;i++){
    const ga=PI2/28*i+ct*.03*(i%2?1:-1);
    const gd=(.35+.5*(i%7)/7)*radius;
    const gx=x+Math.cos(ga)*gd,gy=y+Math.sin(ga)*gd,gr2=radius*(.06+.08*((i*7)%5)/5);
    const granG=ctx.createRadialGradient(gx,gy,0,gx,gy,gr2);
    granG.addColorStop(0,`rgba(255,240,150,${(.5+.5*Math.sin(ct*2.1+i*1.3))*.18})`); granG.addColorStop(1,'rgba(255,100,0,0)');
    ctx.fillStyle=granG; ctx.beginPath(); ctx.arc(gx,gy,gr2,0,PI2); ctx.fill();
  }
  // Sunspots
  for(const [a,d,r,fl] of [[.8,.42,.09,1.1],[2.3,.55,.06,.9],[4.1,.35,.07,1.2],[5.5,.5,.05,.8]]){
    const sa=a+ct*.04*(fl-.9);
    const sx=x+Math.cos(sa)*d*radius,sy=y+Math.sin(sa)*d*radius,sr=r*radius;
    const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,sr);
    sg.addColorStop(0,'rgba(30,10,0,.65)'); sg.addColorStop(.6,'rgba(80,20,0,.35)'); sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,sr,0,PI2); ctx.fill();
  }
  // Specular
  const hl=ctx.createRadialGradient(x-radius*.38,y-radius*.42,0,x-radius*.38,y-radius*.42,radius*.7);
  hl.addColorStop(0,'rgba(255,255,255,.22)'); hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl; ctx.fillRect(x-radius,y-radius,radius*2,radius*2);
  ctx.restore();

  // Rim + godrays
  const rim=ctx.createRadialGradient(x,y,radius*.88,x,y,radius*1.22);
  rim.addColorStop(0,'rgba(0,0,0,0)'); rim.addColorStop(.4,'rgba(255,160,20,.12)'); rim.addColorStop(1,'rgba(255,40,0,0)');
  ctx.fillStyle=rim; ctx.beginPath(); ctx.arc(x,y,radius*1.22,0,PI2); ctx.fill();
  ctx.save(); ctx.globalAlpha=.018;
  for(let i=0;i<6;i++){
    const sa=ct*.05+PI2/6*i;
    const ex=x+Math.cos(sa)*radius*18,ey=y+Math.sin(sa)*radius*18;
    const lx2=x+Math.cos(sa-Math.PI/2)*radius*.8,ly2=y+Math.sin(sa-Math.PI/2)*radius*.8;
    const rx2=x+Math.cos(sa+Math.PI/2)*radius*.8,ry2=y+Math.sin(sa+Math.PI/2)*radius*.8;
    const sg=ctx.createLinearGradient(x,y,ex,ey);
    sg.addColorStop(0,'rgba(255,220,80,1)'); sg.addColorStop(1,'rgba(255,120,0,0)');
    ctx.beginPath(); ctx.moveTo(lx2,ly2); ctx.lineTo(ex,ey); ctx.lineTo(rx2,ry2); ctx.closePath();
    ctx.fillStyle=sg; ctx.fill();
  }
  ctx.restore();
}

function drawCharge(t){
  // ── Screen-space charge ring (around cursor) ──
  if(!holding) return;
  const charge=Math.min((performance.now()-holdT)/2000,1);
  const r=clamp(parseFloat(slider.value)*(1+charge*4)*8,16,110)*charge;
  ctx.beginPath(); ctx.arc(tx,ty,r,0,PI2);
  ctx.strokeStyle=`rgba(255,190,50,${.15+charge*.3})`; ctx.lineWidth=1; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(tx,ty,14,-Math.PI/2,-Math.PI/2+PI2*charge);
  ctx.strokeStyle=`rgba(255,190,50,${.5+charge*.4})`; ctx.lineWidth=2.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(tx,ty,3,0,PI2); ctx.fillStyle=`rgba(255,210,80,${.7+charge*.3})`; ctx.fill();
}

// ══════════════════════════════════════════════════════
//  ORBIT PREDICTION & SPAWN
//
//  DAMPING=1.0 → stable Keplerian orbits. Planets never spiral in.
//  physSpeed only controls traversal rate — same path at any speed.
//  gravMult is snapshotted at spawn — slider changes don't redirect.
//  Preview uses a cosmetic visual-only damping so it shows a pretty
//  inward spiral for context, not a prediction of actual decay.
// ══════════════════════════════════════════════════════

function orbitalSpeed(dist, nP, grav){
  const g = (grav!=null) ? grav : sunGravMult;
  return Math.sqrt(GRAV_CONST * SUN.mass * g / Math.max(nP,1) / Math.max(dist,1));
}

function orbitalPeriod(dist, nP, grav){
  const v = orbitalSpeed(dist, nP, grav);
  return v>0 ? (2*Math.PI*dist/v) : 99999;
}

function getSpawnVelocity(x, y, nP, grav){
  const g   = (grav!=null) ? grav : sunGravMult;
  const dx  = x-SUN.x, dy=y-SUN.y, dist=Math.hypot(dx,dy)||1;
  const v   = orbitalSpeed(dist, nP, g);
  return { vx:-dy/dist*v, vy:dx/dist*v, dist };
}

// ── Visual-only preview simulation ──────────────────
// Uses a gentle cosmetic damping (not physics DAMPING) to draw an
// inward spiral that looks beautiful. The real orbit is undamped.
function computePreviewDamping(periodSub){
  // 88% speed per orbit → ~5 visible loops before reaching sun
  return Math.pow(0.88, 1/Math.max(periodSub, 1));
}

function predictOrbit(spawnX, spawnY, vx0, vy0, nP, steps, dtPerStep, recordEvery, grav){
  const pts = [];
  let px=spawnX, py=spawnY, vx=vx0, vy=vy0;
  const g      = (grav!=null) ? grav : sunGravMult;
  const gm     = GRAV_CONST * SUN.mass * g / Math.max(nP,1);
  const burnR2 = SUN.burnRadius * SUN.burnRadius;
  recordEvery  = recordEvery || 1;

  // Compute visual damping for this orbit's period
  const periodSub = orbitalPeriod(Math.hypot(spawnX-SUN.x, spawnY-SUN.y)||1, nP, g) / dtPerStep;
  const vDamp     = computePreviewDamping(periodSub);

  for(let i=0; i<steps; i++){
    const sdx=SUN.x-px, sdy=SUN.y-py;
    const sd2=sdx*sdx+sdy*sdy;
    if(sd2<burnR2) break;
    const sd=Math.sqrt(sd2)+.1;
    const f=gm/(sd2+500);
    vx=(vx+sdx/sd*f*dtPerStep)*vDamp;
    vy=(vy+sdy/sd*f*dtPerStep)*vDamp;
    px+=vx*dtPerStep; py+=vy*dtPerStep;
    if(i%recordEvery===0) pts.push({x:px, y:py});
  }
  return pts;
}

// ── Preview cache ──────────────────────────────────
let _previewCache = null;
const FIXED_NP       = 100;
const PREVIEW_RECORD = 20;
const TARGET_ORBITS  = 5;

function getPreviewPath(wx, wy){
  // physSpeed does NOT invalidate cache — path shape is speed-independent
  if(_previewCache &&
     Math.abs(_previewCache.wx-wx)<2 &&
     Math.abs(_previewCache.wy-wy)<2 &&
     _previewCache.mult===sunGravMult){
    return _previewCache.pts;
  }

  const dist      = Math.hypot(wx-SUN.x, wy-SUN.y)||1;
  // Use dt=1/SUBSTEPS (physSpeed=1 baseline) — preview is speed-agnostic
  const dtPerStep = 1/SUBSTEPS;
  const periodSub = orbitalPeriod(dist, FIXED_NP, sunGravMult) / dtPerStep;
  const totalSteps= Math.min(Math.ceil(periodSub*(TARGET_ORBITS+2)), 120000);

  const {vx,vy} = getSpawnVelocity(wx, wy, FIXED_NP, sunGravMult);
  const pts = predictOrbit(wx, wy, vx, vy, FIXED_NP,
                           totalSteps, dtPerStep, PREVIEW_RECORD, sunGravMult);

  _previewCache = {wx, wy, pts, mult:sunGravMult};
  return pts;
}
function drawOrbitPreview(t){
  if(!holding) return;
  const charge = Math.min((performance.now()-holdT)/2000, 1);
  const alpha  = clamp(charge*1.6, 0, 0.9);

  const w   = screenToWorld(tx, ty);
  const dx  = w.x-SUN.x, dy=w.y-SUN.y;
  const dist= Math.hypot(dx,dy)||1;

  const pts = getPreviewPath(w.x, w.y);
  if(pts.length < 4) return;

  const total = pts.length;
  const lw    = 1.8/cam.zoom;

  // ── Spiral path: draw in segments, each a different colour/alpha ──
  // Use a single save/restore, vary strokeStyle per segment
  ctx.save();
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';

  // Draw from outer (start) to inner (near sun)
  // Split into ~60 segments for smooth colour transition
  const SEG = Math.max(2, Math.floor(total/60));
  for(let i=0; i<total-SEG; i+=SEG){
    const f0 = i/total;           // 0=spawn, 1=near sun
    const f1 = (i+SEG)/total;
    const fc = (f0+f1)/2;

    // Colour: blue-white → gold → deep orange
    const r = Math.floor(lerp(160, 255, Math.min(fc*1.8, 1)));
    const g = Math.floor(lerp(220, 120, fc));
    const b = Math.floor(lerp(255,  20, Math.min(fc*1.5, 1)));
    // Alpha: strong at start, fades toward end
    const a = alpha * (1 - fc*0.5) * (f0<0.12 ? f0/0.12 : 1); // fade in at start too
    // Line width: thinner as it spirals in
    const w2 = lw * (1.4 - fc*0.9);

    ctx.beginPath();
    ctx.moveTo(pts[i].x, pts[i].y);
    // Smooth through intermediate points
    for(let j=i+1; j<=i+SEG && j<total; j++){
      ctx.lineTo(pts[j].x, pts[j].y);
    }
    ctx.strokeStyle = `rgba(${r},${g},${b},${a})`;
    ctx.lineWidth   = Math.max(0.3/cam.zoom, w2);
    ctx.stroke();
  }

  // ── Flowing travel dots along spiral ──
  const animFrac = (t*0.00035)%1;
  const DOT_COUNT = 7;
  for(let d=0; d<DOT_COUNT; d++){
    const f   = ((d/DOT_COUNT)+animFrac)%1;
    const idx = Math.floor(f*(total-1));
    const pt  = pts[idx];
    const r2  = Math.floor(lerp(160,255,Math.min(f*1.8,1)));
    const g2  = Math.floor(lerp(220,120,f));
    const b2  = Math.floor(lerp(255,20,Math.min(f*1.5,1)));
    const dotR= Math.max(0.8/cam.zoom, (3-f*1.5)/cam.zoom);
    const da  = alpha*(1-f*0.4)*0.95;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,dotR,0,PI2);
    ctx.fillStyle=`rgba(${r2},${g2},${b2},${da})`; ctx.fill();
  }

  ctx.restore();

  // ── Radial line: sun → spawn ──
  ctx.save();
  ctx.globalAlpha=alpha*0.28;
  ctx.setLineDash([3/cam.zoom,4/cam.zoom]);
  ctx.beginPath(); ctx.moveTo(SUN.x,SUN.y); ctx.lineTo(w.x,w.y);
  ctx.strokeStyle='rgba(255,200,80,1)';
  ctx.lineWidth=0.6/cam.zoom; ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // ── Velocity arrow ──
  const tx_=-dy/dist, ty_=dx/dist;
  const alen=Math.min(dist*0.13, 240/cam.zoom);
  const ax=w.x+tx_*alen, ay=w.y+ty_*alen;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.strokeStyle='rgba(160,225,255,1)';
  ctx.fillStyle  ='rgba(160,225,255,1)';
  ctx.lineWidth  =lw*0.85;
  ctx.beginPath(); ctx.moveTo(w.x,w.y); ctx.lineTo(ax,ay); ctx.stroke();
  const ha=Math.atan2(ty_,tx_), hl=alen*0.3;
  ctx.beginPath();
  ctx.moveTo(ax,ay);
  ctx.lineTo(ax-Math.cos(ha-0.38)*hl, ay-Math.sin(ha-0.38)*hl);
  ctx.lineTo(ax-Math.cos(ha+0.38)*hl, ay-Math.sin(ha+0.38)*hl);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // ── Spawn dot ──
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.beginPath(); ctx.arc(w.x,w.y,3.5/cam.zoom,0,PI2);
  ctx.fillStyle='rgba(160,225,255,1)'; ctx.fill();
  ctx.restore();

  // ── Screen-space labels ──
  const m=ctx.getTransform();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.save();
  ctx.font='8px "Space Mono",monospace';
  // Orbital period in frames at current physSpeed
  const period_frames = Math.round(orbitalPeriod(dist, FIXED_NP, sunGravMult) / physSpeed);
  const midSX=((SUN.x-cam.x)*cam.zoom+W/2+(w.x-cam.x)*cam.zoom+W/2)/2;
  const midSY=((SUN.y-cam.y)*cam.zoom+H/2+(w.y-cam.y)*cam.zoom+H/2)/2;
  ctx.fillStyle=`rgba(180,215,255,${alpha*0.65})`;
  ctx.fillText(`r${Math.round(dist)}  ~${period_frames}f`, midSX+8, midSY-4);
  ctx.restore();
  ctx.setTransform(m);
}

function spawnPlanet(x,y,size){
  if(bodies.length>=8) return;
  const radius  = clamp(size*8, 16, 110);
  const pal     = PALS[Math.floor(rnd()*PALS.length)];
  const body    = makeBody(x, y, radius, pal);
  const nP      = body.particles.length;
  // Snapshot current gravity — slider changes after this won't affect this planet
  body.gravMult = sunGravMult;
  // Exact circular orbital velocity at snapshotted gravity
  const {vx,vy} = getSpawnVelocity(x, y, nP, sunGravMult);
  for(const p of body.particles){ p.vx=vx; p.vy=vy; }
  bodies.push(body);
  addFlash(x, y, radius*2, pal.gc);
  updateCount();
}

function updateCount(){
  let n=0; for(const b of bodies) if(!b.dead) n++;
  pcountEl.textContent=n===0?'—':`${n} WORLD${n!==1?'S':''}`;
}

// ══════════════════════════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════
//  PLANET TRAIL — 5-BUFFER RING SYSTEM
//
//  Each frame:
//    1. Clear the current head buffer
//    2. Draw ALL planets into it (once only — no drawBody in main loop)
//    3. Composite all 5 buffers onto screen with eased opacity:
//       head   = full opacity  (current frame)
//       head-1 = ~0.55 opacity
//       head-2 = ~0.28 opacity
//       head-3 = ~0.10 opacity
//       head-4 = ~0.02 opacity (nearly gone)
//    4. Advance head pointer
//
//  Each buffer stores the camera state it was drawn with so pan/zoom
//  are compensated when blitting older frames — ghosts stay aligned.
// ══════════════════════════════════════════════════════
const TRAIL_STEPS = 5;
let trailBufs = [];
let trailHead  = 0;

function initTrailBuffers(){
  trailBufs = Array.from({length:TRAIL_STEPS}, ()=>{
    const c = document.createElement('canvas');
    c.width=W; c.height=H;
    return {canvas:c, ctx:c.getContext('2d'), camX:0, camY:0, camZoom:1, used:false};
  });
}

function resizeTrailBuffers(){
  for(const b of trailBufs){ b.canvas.width=W; b.canvas.height=H; b.used=false; }
}

// Draw all planets into the current head buffer — ONE draw per planet per frame
function renderPlanetsToBuffer(){
  const buf = trailBufs[trailHead];
  const ox  = buf.ctx;

  ox.clearRect(0,0,W,H);

  // Apply current camera transform
  ox.save();
  ox.translate(W/2, H/2);
  ox.scale(cam.zoom, cam.zoom);
  ox.translate(-cam.x, -cam.y);

  for(const b of bodies){
    const {particles:ps, pal} = b;
    const alive = [];
    for(const p of ps) if(!p.dead) alive.push(p);
    if(alive.length < 3) continue;

    const hull = convexHull(alive);
    if(hull.length < 3) continue;

    // ── Hull fill ──
    ox.save();
    ox.beginPath();
    ox.moveTo(hull[0].x, hull[0].y);
    for(let i=1;i<hull.length;i++) ox.lineTo(hull[i].x, hull[i].y);
    ox.closePath();
    const gr = ox.createRadialGradient(b.cx,b.cy,0,b.cx,b.cy,b.radius);
    gr.addColorStop(0,    pal.hi+'ff');
    gr.addColorStop(0.35, pal.mid+'ee');
    gr.addColorStop(0.75, pal.lo+'cc');
    gr.addColorStop(1,    pal.lo+'44');
    ox.fillStyle = gr; ox.fill();
    ox.strokeStyle = `rgba(${pal.gc},.4)`;
    ox.lineWidth = 1.5/cam.zoom; ox.stroke();
    ox.restore();

    // ── Stressed springs ──
    ox.save(); ox.globalAlpha=.07;
    ox.strokeStyle=`rgba(${pal.gc},.9)`;
    ox.lineWidth=.8/cam.zoom; ox.beginPath();
    for(const sp of b.springs){
      if(sp.broken) continue;
      const pa=ps[sp.a], pb=ps[sp.b]; if(pa.dead||pb.dead) continue;
      if(Math.hypot(pb.x-pa.x,pb.y-pa.y)/sp.restLen<1.1) continue;
      ox.moveTo(pa.x,pa.y); ox.lineTo(pb.x,pb.y);
    }
    ox.stroke(); ox.restore();

    // ── Particles ──
    ox.fillStyle=`rgba(${pal.gc},.75)`;
    ox.beginPath();
    for(const p of alive){
      if(p.heat>.05) continue;
      const r=p.isCore?PARTICLE_R*1.3:PARTICLE_R;
      ox.moveTo(p.x+r,p.y); ox.arc(p.x,p.y,r,0,PI2);
    }
    ox.fill();
    for(const p of alive){
      if(p.heat<=.05) continue;
      const r=p.isCore?PARTICLE_R*1.3:PARTICLE_R;
      ox.fillStyle=`rgba(255,${Math.floor(lerp(60,220,p.heat))},30,${p.heat*.9})`;
      ox.beginPath(); ox.arc(p.x,p.y,r,0,PI2); ox.fill();
    }

    // ── Atmosphere ──
    const atm=ox.createRadialGradient(b.cx,b.cy,b.radius*.7,b.cx,b.cy,b.radius*1.8);
    atm.addColorStop(0,`rgba(${pal.gc},.07)`); atm.addColorStop(1,`rgba(${pal.gc},0)`);
    ox.fillStyle=atm; ox.beginPath(); ox.arc(b.cx,b.cy,b.radius*1.8,0,PI2); ox.fill();
  }

  ox.restore(); // end camera transform

  buf.camX=cam.x; buf.camY=cam.y; buf.camZoom=cam.zoom; buf.used=true;
}

// Cubic ease-out: 0→0, 1→1, fast start fading to slow
function trailEase(t){ return 1-Math.pow(1-t,3); }

// Opacity for each step: current=full, then eased decay
// stepAge: 0=current frame, 4=oldest
const TRAIL_ALPHAS = [1.0, 0.52, 0.24, 0.09, 0.02];

// Composite all 5 buffers. Called in screen space (no world transform active).
function drawTrail(){
  for(let age=TRAIL_STEPS-1; age>=0; age--){
    // age 0 = current (newest), drawn last = on top
    const idx = ((trailHead - age - 1) + TRAIL_STEPS*2) % TRAIL_STEPS;
    const buf = trailBufs[idx];
    if(!buf.used) continue;

    const alpha = TRAIL_ALPHAS[age];
    if(alpha < 0.005) continue;

    // Camera delta: account for pan/zoom changes since this buffer was drawn
    const scaleRatio = cam.zoom / buf.camZoom;
    const offX = (buf.camX - cam.x) * cam.zoom;
    const offY = (buf.camY - cam.y) * cam.zoom;

    ctx.save();
    ctx.globalAlpha = alpha;
    // age 0 (current) uses source-over; older frames use 'lighter' for glow
    ctx.globalCompositeOperation = age===0 ? 'source-over' : 'lighter';
    ctx.translate(W/2+offX, H/2+offY);
    ctx.scale(scaleRatio, scaleRatio);
    ctx.translate(-W/2, -H/2);
    ctx.drawImage(buf.canvas, 0, 0);
    ctx.restore();
  }
  ctx.globalCompositeOperation='source-over';
}

// ── FPS counter ────────────────────────────────────────
let fpsSamples=[], fpsDisplay=0;
function updateFPS(rawDt){
  if(rawDt>0){ fpsSamples.push(1/rawDt); if(fpsSamples.length>30) fpsSamples.shift(); }
  if(fpsSamples.length>0) fpsDisplay=Math.round(fpsSamples.reduce((a,b)=>a+b)/fpsSamples.length);
}
function drawFPS(){
  ctx.save();
  ctx.font='10px "Space Mono",monospace';
  ctx.fillStyle='rgba(100,255,160,0.55)';
  ctx.letterSpacing='.05em';
  ctx.fillText(`${fpsDisplay} FPS`, 16, 20);
  ctx.restore();
}

initStars();
initTrailBuffers();
window.addEventListener('resize', ()=>{
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  initStars(); resizeTrailBuffers();
});

ctx.fillStyle='#04040c'; ctx.fillRect(0,0,W,H);

let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const rawDt=Math.min((t-lastT)/1000,.05); lastT=t;
  updateFPS(rawDt);

  tickCam(); updateSpeedBar(); updateZoomBar();

  // Screen-space background
  ctx.fillStyle='rgba(4,4,12,.28)'; ctx.fillRect(0,0,W,H);
  drawNebula(t); drawStars(t);

  // World-space rendering
  ctx.save(); applyCam();

  if(!paused&&physSpeed>0&&rawDt>0){
    const MAX_SAFE_SD=rawDt*3.0*PHYS_SCALE;
    const totalSd=rawDt*physSpeed*PHYS_SCALE;
    const numTicks=Math.ceil(totalSd/MAX_SAFE_SD);
    const sdPerTick=totalSd/numTicks;
    for(let tick=0;tick<numTicks;tick++){
      tickBodies(sdPerTick); tickLoose(sdPerTick);
    }
    tickAsteroids(rawDt*physSpeed*PHYS_SCALE);
  }

  drawFlashes(); drawSun(t); drawLoose(); drawAsteroids();
  drawOrbitPreview(t);

  ctx.restore(); // end world transform

  // ── Planet trail: render once → buffer, composite 5 buffers ──
  renderPlanetsToBuffer();          // draw planets into head buffer
  drawTrail();                      // blit all 5 buffers with eased opacity
  trailHead=(trailHead+1)%TRAIL_STEPS; // advance ring

  // Screen-space overlays
  drawCharge(t);
  drawFPS();
  ctx.fillStyle='rgba(180,210,255,.15)'; ctx.font='8px "Space Mono",monospace';
  ctx.letterSpacing='.18em';
  ctx.fillText(`${(cam.zoom*100).toFixed(0)}%  SCROLL·ZOOM  RIGHT-DRAG·PAN  F·FIT  SPACE·PAUSE`, 16, H-16);

  cursorEl.style.left=tx+'px'; cursorEl.style.top=ty+'px';
  updateCount();
}
requestAnimationFrame(loop);
